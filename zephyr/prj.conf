CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_CAN=y
# after the GPIOs (the transceiver's standby pin), as in all of Seeed's CAN examples
CONFIG_CAN_INIT_PRIORITY=80

# USB CDC ACM console (printk and serial commands), as in Seeed's examples
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_UART_LINE_CTRL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
# opening the port at 1200 baud resets into the UF2 bootloader (pio upload)
CONFIG_UF2_DFU_RESET=y

# %f in printk
CONFIG_CBPRINTF_FP_SUPPORT=y
# 8 KB: the default 2 KB overflows silently (the board hangs, no USB)
CONFIG_MAIN_STACK_SIZE=8192

# recording to flash (the OTA slot), see LogRecord in main.c
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
# flow control on the USB serial port while dumping the recording
CONFIG_UART_USE_RUNTIME_CONFIGURE=y
