[env:xiao]
; Seeed's platform (Zephyr only for this board), pinned to the commit tested here
platform = https://github.com/Seeed-Studio/platform-seeedboards.git#a6fd41debbbcda13b5340fff50c9092ed3289194
framework = zephyr
board = seeed-xiao-stm32c5
platform_packages =
    framework-zephyr@~3.40400.0
    ; the platform asks for GCC 8.2.1, which has no Linux ARM64 build
    platformio/toolchain-gccarmnoneeabi@~1.120301.0
; fixes in the Zephyr framework (a crash in the CAN driver), see the script
extra_scripts = pre:patch_zephyr.py
monitor_speed = 115200
monitor_echo = yes  ; show what you type (serial commands)
